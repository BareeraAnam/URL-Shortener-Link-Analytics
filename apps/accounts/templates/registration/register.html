{% extends "base.html" %}
{% block title %}Create account · Snipr{% endblock %}
{% block body %}
<div class="center"><div class="box">
  <h1>Create your account</h1>
  {% if rate_error %}<p class="err">{{ rate_error }}</p>{% endif %}
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Sign up</button>
  </form>
  <p class="muted">Already registered? <a href="{% url 'login' %}">Sign in</a></p>
</div></div>
{% endblock %}
