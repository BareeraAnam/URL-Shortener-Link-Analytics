<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Snipr{% endblock %}</title>
  <style>
    :root { --bg:#f6f7fb; --card:#fff; --ink:#1c2333; --muted:#6b7385; --brand:#4f46e5; --line:#e4e7ef; --bad:#dc2626; --ok:#16a34a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1220; --card:#181c2e; --ink:#e8eaf2; --muted:#9aa2b8; --line:#2a2f45; } }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
    a { color:var(--brand); }
    .btn { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; font:inherit; }
    .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
    .btn.danger { background:var(--bad); }
    .btn.small { padding:4px 9px; font-size:13px; }
    input, select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); width:100%; }
    .center { min-height:100vh; display:grid; place-items:center; padding:16px; }
    .box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; width:100%; max-width:420px; }
    .box h1 { margin-top:0; font-size:22px; }
    .err { color:var(--bad); } .muted { color:var(--muted); }
    form p { margin:0 0 12px; } label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
    ul.errorlist { color:var(--bad); padding-left:18px; margin:4px 0; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>{% block body %}{% endblock %}</body>
</html>
