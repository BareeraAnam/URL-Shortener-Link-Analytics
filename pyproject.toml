[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["E501", "S101", "S105", "S106", "S311", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E731"]
"config/settings/test.py" = ["E402", "F403", "F405"]
