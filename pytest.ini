[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
addopts = -ra --strict-markers --cov=apps --cov-report=term-missing:skip-covered
markers =
    integration: needs real Postgres + Redis (RUN_INTEGRATION=1, --ds=config.settings.integration)
filterwarnings =
    ignore::DeprecationWarning
